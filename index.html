<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasımpatı</title>
<style>
:root{--bg:#120d28;--ink:#eadff7;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hint{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--ink);font:15px/1.4 "Iowan Old Style",Georgia,serif;opacity:0;transition:opacity 1.2s;pointer-events:none}
#hint.on{opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Yeniden izlemek için dokun</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),hint=document.getElementById('hint');
let W,H,s;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);s=Math.min(W/700,H/820);}
addEventListener('resize',resize);resize();

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;

const R=9,petals=[];
for(let i=0;i<R;i++){const n=12+i*3,off=rnd()*6.28;
  for(let k=0;k<n;k++)petals.push({i,phi:off+k/n*6.2832+(rnd()-.5)*.25,jt:(rnd()-.5)*.18,jl:.92+rnd()*.16});}

function bz(p,u){const m=1-u,a=m*m*m,b=3*m*m*u,c=3*m*u*u,d=u*u*u;
  return[a*p[0][0]+b*p[1][0]+c*p[2][0]+d*p[3][0],a*p[0][1]+b*p[1][1]+c*p[2][1]+d*p[3][1]];}

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let t=reduce?30:0,last=performance.now();
addEventListener('pointerdown',()=>{if(t>18){t=0;hint.classList.remove('on');}});

function leaf(x,y,ang,len){
  g.save();g.translate(x,y);g.rotate(ang);
  const gr=g.createLinearGradient(0,0,len,0);gr.addColorStop(0,'#2b7440');gr.addColorStop(1,'#74c985');
  g.fillStyle=gr;g.beginPath();g.moveTo(0,0);
  g.quadraticCurveTo(len*.5,-len*.36,len,0);g.quadraticCurveTo(len*.5,len*.36,0,0);g.fill();
  g.strokeStyle='rgba(20,70,40,.55)';g.lineWidth=1;g.beginPath();g.moveTo(0,0);g.lineTo(len*.9,0);g.stroke();
  g.restore();
}

function draw(t){
  const cx=W/2,gy=H*.82,Hs=400*s;
  // arka plan
  let gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#120d28');gr.addColorStop(.75,'#2b1a3c');gr.addColorStop(1,'#1a0f22');
  g.fillStyle=gr;g.fillRect(0,0,W,H);

  const sw=reduce?0:Math.sin(t*.8)*6*s*clamp((t-6)/3);
  const P=[[cx,gy],[cx-45*s,gy-Hs*.33],[cx+55*s+sw*.5,gy-Hs*.68],[cx+8*s+sw,gy-Hs]];
  const C=bz(P,1);
  const bloom=clamp((t-8.4)/7);

  // ışıma
  if(bloom>0){
    const rg=g.createRadialGradient(C[0],C[1],0,C[0],C[1],300*s);
    rg.addColorStop(0,'rgba(255,120,170,'+(.3*bloom)+')');rg.addColorStop(1,'rgba(255,120,170,0)');
    g.fillStyle=rg;g.fillRect(0,0,W,H);
  }

  // toprak
  gr=g.createLinearGradient(0,gy,0,H);gr.addColorStop(0,'#3b2417');gr.addColorStop(1,'#150c10');
  g.fillStyle=gr;g.fillRect(0,gy,W,H-gy);

  // tohum
  if(t<2.2){
    let y,a=1;
    if(t<1.1){const u=t/1.1;y=lerp(gy-260*s,gy-6*s,u*u);}
    else{const u=clamp((t-1.1)/.9);y=gy-6*s+u*16*s;a=1-u;}
    g.save();g.globalAlpha=a;g.translate(cx,y);g.rotate(.4);
    g.fillStyle='#6b4423';g.beginPath();g.ellipse(0,0,7*s,12*s,0,0,6.283);g.fill();
    g.fillStyle='rgba(255,220,170,.35)';g.beginPath();g.ellipse(-2*s,-3*s,2*s,5*s,0,0,6.283);g.fill();
    g.restore();
  }
  g.fillStyle='#4a2d1c';g.beginPath();g.ellipse(cx,gy,44*s,9*s,0,0,6.283);g.fill();

  // gövde
  const sp=eo(clamp((t-2)/6));
  if(t>2.05){
    g.lineCap='round';g.lineJoin='round';g.strokeStyle='#49a059';g.lineWidth=Math.max(3,7*s);
    g.beginPath();
    for(let k=0;k<=50;k++){const p=bz(P,sp*k/50);k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);}
    g.stroke();
  }
  // yapraklar
  const us=[.22,.36,.5,.64,.78],ls=[74,66,58,48,40];
  for(let j=0;j<5;j++){
    const gl=eo(clamp((sp-us[j])/.2));if(gl<=0)continue;
    const p=bz(P,us[j]),q1=bz(P,us[j]+.01),q0=bz(P,us[j]-.01);
    const a=Math.atan2(q1[1]-q0[1],q1[0]-q0[0]);
    const side=j%2?1:-1;
    leaf(p[0],p[1],a+side*1.0+(reduce?0:Math.sin(t*1.2+j)*.05),ls[j]*s*gl);
  }

  // çanak
  const bs=eo(clamp((t-6.8)/1.6));
  if(bs>0){g.fillStyle='#3d8f4d';g.beginPath();g.ellipse(C[0],C[1]+3*s,16*s*bs,12*s*bs,0,0,6.283);g.fill();}

  // taç yapraklar
  const Lg=eo(clamp((t-7.4)/1.4));
  if(Lg>0){
    const cT=Math.cos(.42),sT=Math.sin(.42),Rm=125*s,list=[];
    for(const p of petals){
      const i=p.i,e=eio(clamp((t-8.4-i*.42)/4.6));
      const th=lerp(.12,lerp(1.5,.75,i/(R-1)),e)+p.jt;
      const L=Rm*(1-i*.085)*p.jl*Lg*(.8+.2*e);
      const x=Math.sin(th)*Math.cos(p.phi),y=Math.cos(th),z=Math.sin(th)*Math.sin(p.phi);
      const d=.25*e*(1-i/R*.5);
      const tx=x*L,ty=y*L-d*L,tz=z*L;
      const kx=x*L*.55,ky=y*L*.55+.12*L,kz=z*L*.55;
      list.push({i,L,
        tx:C[0]+tx,ty:C[1]-(ty*cT-tz*sT),
        kx:C[0]+kx,ky:C[1]-(ky*cT-kz*sT),
        dp:z*cT+y*sT});
    }
    list.sort((a,b)=>a.dp-b.dp);
    const bx=C[0],by=C[1];
    for(const p of list){
      const f=p.i/(R-1),h=(335+65*f)%360,l=57+f*9;
      const dx=p.tx-bx,dy=p.ty-by,len=Math.hypot(dx,dy)||1;
      const nx=-dy/len*p.L*.16,ny=dx/len*p.L*.16;
      const fg=g.createLinearGradient(bx,by,p.tx,p.ty);
      fg.addColorStop(0,'hsl('+h+',78%,'+(l-20)+'%)');fg.addColorStop(1,'hsl('+h+',82%,'+(l+9)+'%)');
      g.fillStyle=fg;g.beginPath();g.moveTo(bx,by);
      g.quadraticCurveTo(p.kx+nx,p.ky+ny,p.tx,p.ty);
      g.quadraticCurveTo(p.kx-nx,p.ky-ny,bx,by);g.fill();
      g.strokeStyle='hsla('+h+',90%,88%,.3)';g.lineWidth=.6;g.stroke();
    }
  }
  const hu=eo(clamp((t-13.5)/4));
  if(hu>0){
    const k=130*s*(.25+.75*hu),fl=reduce?0:Math.sin(t*1.6)*5*s*hu;
    g.save();g.translate(C[0],C[1]-hu*170*s+fl);g.globalAlpha=clamp(hu*2);
    g.beginPath();g.moveTo(0,.9*k);g.bezierCurveTo(-1.1*k,.1*k,-.9*k,-.8*k,0,-.35*k);g.bezierCurveTo(.9*k,-.8*k,1.1*k,.1*k,0,.9*k);
    g.fillStyle='rgba(235,50,100,.9)';g.shadowColor='rgba(255,90,150,.8)';g.shadowBlur=24*s;g.fill();
    g.shadowBlur=0;g.strokeStyle='rgba(255,220,235,.9)';g.lineWidth=Math.max(1.5,2*s);g.stroke();
    g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font='700 '+(k*.14)+'px "Iowan Old Style",Georgia,serif';
    g.fillText('SENİ ÇOK',0,.0*k);g.fillText('SEVİYORUM',0,.19*k);
    g.restore();
  }
  if(t>19)hint.classList.add('on');
}

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!reduce)t+=dt;
  draw(t);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
