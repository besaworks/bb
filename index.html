<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasımpatı Demeti</title>
<style>
:root{--bg:#120d28;--ink:#eadff7;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
#hint{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--ink);font:15px/1.4 "Iowan Old Style",Georgia,serif;opacity:0;transition:opacity 1.2s;pointer-events:none}
#hint.on{opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Yeniden izlemek için dokun</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),hint=document.getElementById('hint');
let W,H,s;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);s=Math.min(W/660,H/820);}
addEventListener('resize',resize);resize();

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;

const R=innerWidth<600?6:7,petals=[];
for(let i=0;i<R;i++){const n=10+i*3,off=rnd()*6.28;
  for(let k=0;k<n;k++)petals.push({i,phi:off+k/n*6.2832+(rnd()-.5)*.25,jt:(rnd()-.5)*.18,jl:.92+rnd()*.16});}

// demetteki çiçekler: x kayması, boy, boyut, açma gecikmesi, renk kayması
const FL=[
  {dx:0,h:400,z:1,dl:0,sh:0,ph:0},
  {dx:-110,h:340,z:.85,dl:.4,sh:-12,ph:1},
  {dx:110,h:350,z:.85,dl:.6,sh:12,ph:2},
  {dx:-200,h:270,z:.7,dl:.9,sh:-24,ph:3},
  {dx:200,h:280,z:.7,dl:1.1,sh:22,ph:4},
  {dx:-55,h:300,z:.55,dl:1.4,sh:8,ph:5,thin:1},{dx:55,h:310,z:.55,dl:1.6,sh:-8,ph:6,thin:1},
  {dx:-150,h:225,z:.5,dl:1.8,sh:-16,ph:7,thin:1},{dx:150,h:235,z:.5,dl:2,sh:16,ph:8,thin:1},
  {dx:0,h:240,z:.5,dl:2.2,sh:0,ph:9,thin:1}
];

function bz(p,u){const m=1-u,a=m*m*m,b=3*m*m*u,c=3*m*u*u,d=u*u*u;
  return[a*p[0][0]+b*p[1][0]+c*p[2][0]+d*p[3][0],a*p[0][1]+b*p[1][1]+c*p[2][1]+d*p[3][1]];}

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let t=reduce?30:0,last=performance.now();
addEventListener('pointerdown',()=>{if(t>20){t=0;hint.classList.remove('on');}});

function leaf(x,y,ang,len){
  g.save();g.translate(x,y);g.rotate(ang);
  const gr=g.createLinearGradient(0,0,len,0);gr.addColorStop(0,'#2b7440');gr.addColorStop(1,'#74c985');
  g.fillStyle=gr;g.beginPath();g.moveTo(0,0);
  g.quadraticCurveTo(len*.5,-len*.36,len,0);g.quadraticCurveTo(len*.5,len*.36,0,0);g.fill();
  g.strokeStyle='rgba(20,70,40,.55)';g.lineWidth=1;g.beginPath();g.moveTo(0,0);g.lineTo(len*.9,0);g.stroke();
  g.restore();
}

const cT=Math.cos(.42),sT=Math.sin(.42);
function flower(F,C,t){
  const te=8+F.ph*.2,Lg=eo(clamp((t-te+.6)/1.4));
  if(Lg<=0)return;
  g.fillStyle='#3d8f4d';g.beginPath();g.ellipse(C[0],C[1]+3*s*F.z,16*s*F.z*Lg,12*s*F.z*Lg,0,0,6.283);g.fill();
  const Rm=125*s*F.z,list=[];
  for(const p of petals){if(F.thin&&p.i%2)continue;
    const i=p.i,e=eio(clamp((t-8.4-F.dl-i*.42)/4.6));
    const th=lerp(.12,lerp(1.5,.75,i/(R-1)),e)+p.jt;
    const L=Rm*(1-i*.1)*p.jl*Lg*(.8+.2*e),ph=p.phi+F.ph*1.7;
    const x=Math.sin(th)*Math.cos(ph),y=Math.cos(th),z=Math.sin(th)*Math.sin(ph);
    const d=.25*e*(1-i/R*.5);
    const tx=x*L,ty=y*L-d*L,tz=z*L,kx=x*L*.55,ky=y*L*.55+.12*L,kz=z*L*.55;
    list.push({i,L,tx:C[0]+tx,ty:C[1]-(ty*cT-tz*sT),kx:C[0]+kx,ky:C[1]-(ky*cT-kz*sT),dp:z*cT+y*sT});
  }
  list.sort((a,b)=>a.dp-b.dp);
  const bx=C[0],by=C[1];
  for(const p of list){
    const f=p.i/(R-1),h=(335+65*f+F.sh+360)%360,l=57+f*9;
    const dx=p.tx-bx,dy=p.ty-by,len=Math.hypot(dx,dy)||1;
    const nx=-dy/len*p.L*.16,ny=dx/len*p.L*.16;
    let fg;if(F.thin)fg='hsl('+h+',80%,'+(l-3)+'%)';else{fg=g.createLinearGradient(bx,by,p.tx,p.ty);
    fg.addColorStop(0,'hsl('+h+',78%,'+(l-20)+'%)');fg.addColorStop(1,'hsl('+h+',82%,'+(l+9)+'%)');}
    g.fillStyle=fg;g.beginPath();g.moveTo(bx,by);
    g.quadraticCurveTo(p.kx+nx,p.ky+ny,p.tx,p.ty);
    g.quadraticCurveTo(p.kx-nx,p.ky-ny,bx,by);g.fill();
    if(!F.thin){g.strokeStyle='hsla('+h+',90%,88%,.3)';g.lineWidth=.6;g.stroke();}
  }
}

function draw(t){
  const cx=W/2,gy=Math.min(H*.88,H/2+300*s);
  let gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#120d28');gr.addColorStop(.75,'#2b1a3c');gr.addColorStop(1,'#1a0f22');
  g.fillStyle=gr;g.fillRect(0,0,W,H);

  // her gövdenin eğrisi
  const st=FL.map((F,i)=>{
    const h=F.h*s,dx=F.dx*s,sw=reduce?0:Math.sin(t*.8+F.ph*1.3)*6*s*clamp((t-6)/3);
    const P=[[cx,gy],[cx+dx*.1,gy-h*.35],[cx+dx*.75+sw*.5,gy-h*.7],[cx+dx+sw,gy-h]];
    return{P,C:bz(P,1),sp:eo(clamp((t-2-F.ph*.2)/6))};
  });
  const C0=st[0].C,bloom=clamp((t-8.4)/8);

  if(bloom>0){
    const rg=g.createRadialGradient(C0[0],C0[1]+60*s,0,C0[0],C0[1]+60*s,420*s);
    rg.addColorStop(0,'rgba(255,120,170,'+(.28*bloom)+')');rg.addColorStop(1,'rgba(255,120,170,0)');
    g.fillStyle=rg;g.fillRect(0,0,W,H);
  }

  // toprak
  gr=g.createLinearGradient(0,gy,0,H);gr.addColorStop(0,'#3b2417');gr.addColorStop(1,'#150c10');
  g.fillStyle=gr;g.fillRect(0,gy,W,H-gy);

  // tohum
  if(t<2.2){
    let y,a=1;
    if(t<1.1){const u=t/1.1;y=lerp(gy-260*s,gy-6*s,u*u);}
    else{const u=clamp((t-1.1)/.9);y=gy-6*s+u*16*s;a=1-u;}
    g.save();g.globalAlpha=a;g.translate(cx,y);g.rotate(.4);
    g.fillStyle='#6b4423';g.beginPath();g.ellipse(0,0,7*s,12*s,0,0,6.283);g.fill();
    g.fillStyle='rgba(255,220,170,.35)';g.beginPath();g.ellipse(-2*s,-3*s,2*s,5*s,0,0,6.283);g.fill();
    g.restore();
  }
  g.fillStyle='#4a2d1c';g.beginPath();g.ellipse(cx,gy,70*s,10*s,0,0,6.283);g.fill();

  // gövdeler ve yapraklar
  const us=[.25,.4,.55,.7],ls=[66,58,50,42];
  st.forEach((o,i)=>{
    if(t<2.05)return;
    const F=FL[i];
    g.lineCap='round';g.lineJoin='round';g.strokeStyle='#49a059';g.lineWidth=Math.max(3,6.5*s*(.7+.3*F.z));
    g.beginPath();
    for(let k=0;k<=50;k++){const p=bz(o.P,o.sp*k/50);k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);}
    g.stroke();
    for(let j=0;j<(F.thin?2:4);j++){
      const gl=eo(clamp((o.sp-us[j])/.2));if(gl<=0)continue;
      const p=bz(o.P,us[j]),q1=bz(o.P,us[j]+.01),q0=bz(o.P,us[j]-.01);
      const a=Math.atan2(q1[1]-q0[1],q1[0]-q0[0]),side=(j+i)%2?1:-1;
      leaf(p[0],p[1],a+side*1.0+(reduce?0:Math.sin(t*1.2+j+i)*.05),ls[j]*s*gl*(.75+.25*F.z));
    }
  });

  // çiçekler (arkadan öne)
  FL.forEach((F,i)=>flower(F,st[i].C,t));

  // kalp, ortadaki çiçekten yükselir
  const hu=eo(clamp((t-15)/4));
  if(hu>0){
    const kb=Math.max(72*s,Math.min(W*.12,84)),k=kb*(.25+.75*hu),fl=reduce?0:Math.sin(t*1.6)*5*s*hu;
    g.save();g.translate(C0[0],C0[1]-hu*(110*s+.95*kb)+fl);g.globalAlpha=clamp(hu*2);
    g.beginPath();g.moveTo(0,.95*k);g.bezierCurveTo(-.2*k,.75*k,-1.1*k,.15*k,-1.1*k,-.3*k);g.bezierCurveTo(-1.1*k,-.78*k,-.5*k,-1*k,0,-.42*k);g.bezierCurveTo(.5*k,-1*k,1.1*k,-.78*k,1.1*k,-.3*k);g.bezierCurveTo(1.1*k,.15*k,.2*k,.75*k,0,.95*k);
    g.fillStyle='rgba(235,50,100,.92)';g.shadowColor='rgba(255,90,150,.8)';g.shadowBlur=24*s;g.fill();
    g.shadowBlur=0;g.strokeStyle='rgba(255,220,235,.9)';g.lineWidth=Math.max(1.5,2*s);g.stroke();
    g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font='700 '+Math.max(k*.21,10*hu)+'px "Iowan Old Style",Georgia,serif';
    g.fillText('SENİ ÇOK',0,-.1*k);g.fillText('SEVİYORUM',0,.16*k);
    g.restore();
  }
  if(t>20.5)hint.classList.add('on');
}

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!reduce)t+=dt;
  draw(t);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
