<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beni affet</title>
<style>
:root{--bg:#0b0306;--fg:#fff3ee;--b1:#ff3d5a;--b2:#b3123a;--glow:rgba(255,61,90,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0306}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:Georgia,"Times New Roman",serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#btn{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:20px 44px;font-size:clamp(20px,6vw,28px);font-family:inherit;color:#fff;border:0;border-radius:999px;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 0 30px var(--glow);cursor:pointer;animation:pulse 1.6s ease-in-out infinite;transition:opacity .5s,transform .5s;z-index:3}
#btn.gone{opacity:0;transform:translate(-50%,-50%) scale(.6);pointer-events:none}
@keyframes pulse{0%,100%{box-shadow:0 0 22px var(--glow)}50%{box-shadow:0 0 52px var(--glow)}}
#txt{position:fixed;left:50%;transform:translate(-50%,-50%) scale(.8);margin:0;font-size:clamp(34px,11vw,72px);font-style:italic;font-weight:normal;text-align:center;color:#ffe1b8;text-shadow:0 0 12px #ff7a1a,0 0 30px #ff3d1a;opacity:0;transition:opacity 1.6s,transform 1.6s;z-index:2;pointer-events:none;white-space:nowrap}
#txt.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="btn">bas bana</button>
<h1 id="txt">beni affet</h1>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),btn=document.getElementById('btn'),txt=document.getElementById('txt');
var W,H,D,cx,cy,sc;
function size(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);
sc=Math.min(W*0.72/32,H*0.5/30);cx=W/2;cy=H*0.46;txt.style.left=cx+'px';txt.style.top=(cy+sc*1)+'px'}
size();addEventListener('resize',size);
function hp(t){return{x:cx+16*Math.pow(Math.sin(t),3)*sc,y:cy-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*sc}}
var roses=[],fire=[],started=false,t0=0,DUR=3800,done=false;
function burst(n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=12+Math.random()*18;
roses.push({x:W/2,y:H/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*6,vr:(Math.random()-.5)*.2,s:20+Math.random()*22,life:1})}}
function rain(){roses.push({x:Math.random()*W,y:-30,vx:(Math.random()-.5)*1.2,vy:1.2+Math.random()*1.8,r:Math.random()*6,vr:(Math.random()-.5)*.08,s:18+Math.random()*16,life:1,rain:1})}
function emit(p,n){for(var i=0;i<n;i++)fire.push({x:p.x+(Math.random()-.5)*6,y:p.y+(Math.random()-.5)*6,vx:(Math.random()-.5)*.8,vy:-(.4+Math.random()*1.6),l:1,d:.012+Math.random()*.02,s:5+Math.random()*9})}
btn.addEventListener('click',function(){if(started)return;started=true;btn.classList.add('gone');t0=performance.now();
burst(70);setTimeout(function(){burst(50)},350);setTimeout(function(){burst(40)},800)});
var sp=[],rI=document.createElement('canvas');
function mk(col){var k=document.createElement('canvas');k.width=k.height=64;var q=k.getContext('2d'),g=q.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba('+col+',1)');g.addColorStop(1,'rgba('+col+',0)');q.fillStyle=g;q.fillRect(0,0,64,64);return k}
sp=[mk('255,230,120'),mk('255,130,30'),mk('220,40,20')];
rI.width=rI.height=64;var rq=rI.getContext('2d');rq.font='52px serif';rq.textAlign='center';rq.textBaseline='middle';rq.fillText('\uD83C\uDF39',32,34);
var last=0;
function frame(now){
var dt=last?Math.min((now-last)/16.667,3):1;last=now;
x.clearRect(0,0,W,H);
if(started){
var p=Math.min((now-t0)/DUR,1);
if(p<1){emit(hp(Math.PI+p*Math.PI*2),7)}
else{if(!done){done=true;txt.classList.add('show')}
for(var k=0;k<5;k++)emit(hp(Math.random()*Math.PI*2),1)}
if(done&&Math.random()<.12)rain();
}
x.globalCompositeOperation='lighter';
for(var i=fire.length-1;i>=0;i--){var f=fire[i];f.x+=(f.vx+Math.sin(f.y*.05)*.3)*dt;f.y+=f.vy*dt;f.l-=f.d*dt;
if(f.l<=0){fire.splice(i,1);continue}
var r=(f.s*f.l+1)*2;x.globalAlpha=Math.min(1,f.l*1.2);
x.drawImage(sp[f.l>.66?0:f.l>.33?1:2],f.x-r,f.y-r,r*2,r*2)}
x.globalAlpha=1;
x.globalCompositeOperation='source-over';
for(var j=roses.length-1;j>=0;j--){var o=roses[j];o.x+=o.vx*dt;o.y+=o.vy*dt;o.r+=o.vr*dt;
if(!o.rain){o.vy+=.4*dt;o.vx*=Math.pow(.99,dt);o.life-=.006*dt}
if(o.y>H+50||o.life<=0){roses.splice(j,1);continue}
x.save();x.globalAlpha=Math.max(0,Math.min(1,o.life*1.5));x.translate(o.x,o.y);x.rotate(o.r);
x.drawImage(rI,-o.s/2,-o.s/2,o.s,o.s);x.restore()}
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
